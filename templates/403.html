<!-- FILE: templates/403.html -->
{% extends 'base.html' %}

{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="card" style="max-width: 550px; margin: 3rem auto; text-align: center; padding: 3rem 1.5rem;">
  <h1 style="font-size: 4rem; color: var(--danger); margin-bottom: 0.5rem;">403</h1>
  <h2 style="margin-bottom: 1rem;">Access Forbidden</h2>
  <p style="color: var(--text-muted); margin-bottom: 2rem;">
    You do not possess the required user permissions or role to view this resource.
  </p>
  <a href="{% url 'home' %}" class="btn btn-secondary">Back to Dashboard</a>
</div>
{% endblock %}
