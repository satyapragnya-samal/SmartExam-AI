<!-- FILE: templates/accounts/login.html -->
{% extends 'base.html' %}

{% block title %}Login | Online Examination System{% endblock %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 0 auto;">
  <h2 class="card-title" style="text-align: center;">Sign In</h2>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" class="form-control" required autofocus>
    </div>
    <div class="form-group">
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
  </form>
  <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
    Need an account? <a href="{% url 'register' %}">Register now</a>
  </p>
</div>
{% endblock %}
