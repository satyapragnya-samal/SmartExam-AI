<!-- FILE: templates/404.html -->
{% extends 'base.html' %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="card" style="max-width: 550px; margin: 3rem auto; text-align: center; padding: 3rem 1.5rem;">
  <h1 style="font-size: 4rem; color: var(--primary); margin-bottom: 0.5rem;">404</h1>
  <h2 style="margin-bottom: 1rem;">Page Not Found</h2>
  <p style="color: var(--text-muted); margin-bottom: 2rem;">
    The page or exam you are looking for does not exist or has been relocated.
  </p>
  <a href="{% url 'home' %}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
